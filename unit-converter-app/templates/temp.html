<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="converter-container">
        <h1>Unit Converter</h1>
        <nav class="category-selector">
            <a href="length.html" class="category-link">Length</a>
            <a href="weight.html" class="category-link">Weight</a>
            <a href="temp.html" class="category-link active">Temperature</a>
        </nav>
        
        <form action="/temp.html" method="POST">
            <div class="form-field">
                <label class="label">Enter the temperature to convert</label>
                <input type="number" step="any" class="sketchy-input" name="temp_value" value="{{ temp_value }}" required>
            </div>

            <div class="form-field">
                <label class="label">Unit to convert from</label>
                <select class="sketchy-input" name="unit_from">
                    <option value="celsius" {% if unit_from == 'celsius' %}selected{% endif %}>Celsius (ºC)</option>
                    <option value="fahrenheit" {% if unit_from == 'fahrenheit' %}selected{% endif %}>Fahrenheit (ºF)</option>
                    <option value="kelvin" {% if unit_from == 'kelvin' %}selected{% endif %}>Kelvin (K)</option>
                </select>
            </div>

            <div class="form-field">
                <label class="label">Unit to convert to</label>
                <select class="sketchy-input" name="unit_to">
                    <option value="celsius" {% if unit_to == 'celsius' %}selected{% endif %}>Celsius (ºC)</option>
                    <option value="fahrenheit" {% if unit_to == 'fahrenheit' %}selected{% endif %}>Fahrenheit (ºF)</option>
                    <option value="kelvin" {% if unit_to == 'kelvin' %}selected{% endif %}>Kelvin (K)</option>
                </select>
            </div>
            <button type="submit" class="convert-button">Convert</button>
        </form>

        {% if result %}
        <div class="result-box" style="margin-top: 30px; padding: 15px; border: 3px dashed #333; border-radius: 12px; font-size: 26px; text-align: center; background-color: #f0f7ff;">
            {{ result }}
        </div>
        {% endif %}

    </div>
</body>
</html>
